# /etc/nginx/sites-available/ariane  (ln -s vers sites-enabled, puis certbot)
# nginx termine le HTTPS (indispensable au service worker) et reverse vers Node.
server {
    listen 80;
    server_name votre-domaine.ma;
    # certbot --nginx remplace ce bloc par un 443 + redirection une fois le
    # certificat Let's Encrypt obtenu.
    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    client_max_body_size 1m;   # les avis font 2 Ko ; rien de gros ne passe ici
}
